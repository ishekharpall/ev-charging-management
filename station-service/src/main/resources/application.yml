server:
  port: 8081

spring:

  application:
    name: station-service

  datasource:
    url: jdbc:postgresql://localhost:5432/userServiceDb


  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true


management:
  endpoints:
    web:
      exposure:
        include: health,info